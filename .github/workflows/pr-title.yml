name: pr-title

# Squash merges use the PR title as the commit message, and release-please reads it to pick the next version.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # conventional-title is a required check, so the merge queue waits for it too. The title was already checked on the
  # pull request, so the queue run only reports success.
  merge_group:

permissions:
  pull-requests: read

jobs:
  conventional-title:
    # Editing only the description changes nothing to check.
    if: github.event.action != 'edited' || github.event.changes.title != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'merge_group'
        run: echo "Title checked on the pull request."
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
